<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>红笔 · 签约前 5 分钟</title>
<style>
:root{
  --bg:#0C1117;
  --cream:#F4F7FA;
  --cream-soft:rgba(244,247,250,.76);
  --cream-faint:rgba(244,247,250,.46);
  --rule:rgba(244,247,250,.11);
  --brand:#1F3243;
  --brand-light:#E9EFF4;
  --accent:#C04434;
  --gold:#B5975B;
  --serif:"Noto Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.33,1,.68,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--cream);
  font-family:var(--serif);font-size:13px;line-height:1.55;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* backdrop */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.backdrop::before{
  content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(52% 44% at 50% -6%,rgba(31,50,67,.5),transparent 72%),
    radial-gradient(40% 40% at 6% 104%,rgba(192,68,52,.1),transparent 70%),
    radial-gradient(46% 46% at 96% 4%,rgba(52,84,110,.22),transparent 74%);
}
.backdrop::after{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(244,247,250,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(244,247,250,.035) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 46%,#000 24%,transparent 100%);
  mask-image:radial-gradient(70% 60% at 50% 46%,#000 24%,transparent 100%);
}
.backdrop .mark{
  position:absolute;left:-2vw;bottom:-14vh;white-space:nowrap;
  font-family:var(--serif);font-size:32vw;line-height:.86;font-weight:700;
  letter-spacing:.02em;color:rgba(244,247,250,.018);
}

/* top bar */
.bar{
  position:relative;z-index:4;flex:none;height:62px;display:flex;align-items:center;gap:20px;
  padding:0 26px;border-bottom:1px solid var(--rule);
  background:linear-gradient(rgba(13,18,25,.92),rgba(12,17,23,.7));
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{
  width:34px;height:34px;flex:none;border-radius:9px;background:var(--brand);
  display:grid;place-items:center;box-shadow:0 6px 18px -8px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.08);
}
.mark svg{width:23px;height:23px;display:block}
.brand-copy{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-size:18px;font-weight:700;letter-spacing:1.4px}
.brand-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--cream-faint);margin-top:4px}
.bar-meta{display:flex;align-items:center;gap:16px;padding-left:20px;border-left:1px solid var(--rule);font-size:10.5px;color:var(--cream-faint);white-space:nowrap}
.meta-item{display:inline-flex;align-items:center;gap:6px}
.meta-item .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.switch{display:flex;gap:2px;padding:3px;border:1px solid var(--rule);border-radius:10px;background:rgba(244,247,250,.055)}
.switch button{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;border:0;border-radius:7px;
  background:transparent;color:rgba(244,247,250,.58);font-size:12px;font-weight:500;
  transition:background .18s,color .18s,box-shadow .18s;
}
.switch button:hover{color:var(--cream);background:rgba(244,247,250,.07)}
.switch button[aria-selected="true"]{background:var(--cream);color:#15202B;font-weight:600;box-shadow:0 10px 24px -14px rgba(0,0,0,.9)}
.switch svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* stage */
.stage{position:relative;z-index:2;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;padding:14px 26px 12px}
.stage-head{flex:none;display:flex;align-items:center;gap:11px;height:30px;width:100%;max-width:1560px}
.kicker{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:rgba(244,247,250,.3);white-space:nowrap}
.stage-title{font-size:14.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.stage-note{font-size:10.5px;color:var(--cream-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-note::before{content:"·";margin-right:8px;color:rgba(244,247,250,.24)}
.stage-res{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:rgba(244,247,250,.36);white-space:nowrap}

.holder{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;overflow-anchor:none}
.device{flex:0 0 auto;transform-origin:center center;transition:none}

/* Windows window */
.device.desktop{
  width:1280px;border-radius:10px;overflow:hidden;background:#0E141B;
  box-shadow:
    0 80px 150px -60px rgba(0,0,0,.95),
    0 26px 60px -30px rgba(0,0,0,.75),
    0 0 0 1px rgba(244,247,250,.14);
}
.win-bar{
  height:38px;display:flex;align-items:center;gap:12px;padding:0 4px 0 12px;
  background:#F7F9FB;border-bottom:1px solid #E3E8EE;color:#475666;
}
.win-app{display:flex;align-items:center;gap:8px;min-width:0;font-size:11.5px;white-space:nowrap}
.win-mark{width:18px;height:18px;flex:none;border-radius:4px;background:var(--brand);display:grid;place-items:center}
.win-mark svg{width:13px;height:13px;display:block}
.win-title{color:#101820;font-weight:500}
.win-sub{color:#9AA7B4;margin-left:2px}
.win-controls{margin-left:auto;display:flex;height:100%;align-items:stretch;color:#6B7A88}
.win-controls i{width:44px;display:grid;place-items:center;font-style:normal;font-size:10px;line-height:1}
.win-controls i.close:hover{background:#B23A2F;color:#fff}
.device.desktop .screen{position:relative;width:1280px;height:800px;background:#F2F4F7}
.device.desktop .screen iframe{display:block;width:1280px;height:800px;border:0;background:#F2F4F7}

/* Android phone */
.device.mobile{
  width:412px;height:866px;padding:11px;border-radius:52px;position:relative;background:#080C10;
  box-shadow:
    0 60px 120px -40px rgba(0,0,0,.95),
    0 0 0 1px rgba(244,247,250,.16),
    inset 0 0 0 1px rgba(255,255,255,.05);
}
.device.mobile::before,.device.mobile::after{content:"";position:absolute;width:3px;border-radius:2px;background:#1B2530}
.device.mobile::before{right:-3px;top:184px;height:62px}
.device.mobile::after{left:-3px;top:148px;height:32px;box-shadow:0 48px 0 #1B2530}
.device.mobile .screen{
  position:relative;width:390px;height:844px;border-radius:41px;overflow:hidden;
  background:#F2F4F7;display:flex;flex-direction:column;
}
.device.mobile .status{
  flex:none;height:30px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px 0 24px;background:#101820;color:rgba(244,247,250,.92);
  font-size:11px;font-variant-numeric:tabular-nums;
}
.status-icons{display:flex;align-items:center;gap:5px}
.status-icons svg{height:10px;fill:currentColor;stroke:none;display:block}
.status-icons svg:nth-child(2){width:14px}
.status-icons svg:nth-child(3){width:21px}
.device.mobile .screen iframe{display:block;width:390px;height:814px;flex:none;border:0;background:#F2F4F7}
.punch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#05080B;box-shadow:inset 0 0 0 1px rgba(244,247,250,.1)}
.home-bar{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:112px;height:4px;border-radius:2px;background:rgba(244,247,250,.28);pointer-events:none;z-index:3}

.loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#F2F4F7;color:#6B7A88;font-size:11.5px;letter-spacing:.1em;transition:opacity .28s ease}
.loading.is-done{opacity:0;pointer-events:none}

/* foot */
.stage-foot{flex:none;min-height:46px;width:100%;max-width:1560px;display:flex;align-items:center;gap:14px;font-size:10.5px;color:var(--cream-faint)}
.state{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border:1px solid var(--rule);border-radius:999px;background:rgba(244,247,250,.035);color:var(--cream-soft);white-space:nowrap}
#stateDot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(181,151,91,.13)}
#stateDot.is-live{animation:live 1.15s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.78)}}
.foot-hint{color:rgba(244,247,250,.34);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{margin-left:auto;display:flex;gap:8px;flex:none}
.dbtn{height:32px;padding:0 14px;border-radius:7px;border:1px solid var(--rule);background:rgba(244,247,250,.05);color:var(--cream-soft);font-size:11px;transition:background .18s,color .18s,border-color .18s,transform .12s}
.dbtn:hover{background:rgba(244,247,250,.1);color:var(--cream);border-color:rgba(244,247,250,.22)}
.dbtn:active{transform:translateY(1px)}
.dbtn.primary{background:var(--cream);color:#15202B;border-color:transparent;font-weight:600}
.dbtn.primary:hover{background:#fff}
.dbtn:disabled{opacity:.45;cursor:not-allowed;transform:none}

@media (max-width:1100px){.bar-meta{display:none}}
@media (max-width:820px){
  .bar{height:56px;padding:0 14px;gap:12px}
  .brand-sub{display:none}
  .kicker,.stage-note,.foot-hint{display:none}
  .stage{padding:10px 12px 8px}
  .stage-head{height:26px}
  .stage-foot{min-height:42px;gap:8px}
  .switch button{padding:0 10px;font-size:11.5px}
  .dbtn{padding:0 11px;font-size:10.5px}
}
@media (max-width:560px){
  .brand-name{font-size:16px}
  .mark{width:30px;height:30px;font-size:18px}
  .switch button svg{display:none}
  .stage-res{display:none}
}
@media (prefers-reduced-motion:reduce){
  .device{transition:none}
  #stateDot.is-live{animation:none}
}

/* client light surface */
:root{
  --bg:#F2F4F7;
  --cream:#101820;
  --cream-soft:#475666;
  --cream-faint:#5F6E7B;
  --rule:#E3E8EE;
  --gold:#946200;
}
body{background:var(--bg);color:#101820}
.backdrop::before{
  background:
    radial-gradient(52% 44% at 50% -6%,rgba(31,50,67,.10),transparent 72%),
    radial-gradient(40% 40% at 6% 104%,rgba(192,68,52,.06),transparent 70%),
    radial-gradient(46% 46% at 96% 4%,rgba(52,84,110,.08),transparent 74%);
}
.backdrop::after{
  background-image:
    linear-gradient(rgba(16,24,32,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(16,24,32,.04) 1px,transparent 1px);
}
.backdrop .mark{color:rgba(16,24,32,.025)}
.bar{
  background:rgba(255,255,255,.92);
  border-bottom-color:var(--rule);
  box-shadow:0 1px 2px rgba(16,24,32,.04);
}
.brand-sub{color:#8A98A6}
.bar-meta{border-left-color:var(--rule);color:#5F6E7B}
.meta-item .dot{background:#B23A2F}
.switch{background:#EDF1F5;border-color:#E3E8EE}
.switch button{color:#5F6E7B}
.switch button:hover{background:#E3E8EE;color:#101820}
.switch button[aria-selected="true"]{
  background:#FFFFFF;color:#101820;
  box-shadow:0 1px 2px rgba(16,24,32,.08),0 2px 8px rgba(16,24,32,.06);
}
.kicker{color:#8A98A6}
.stage-note{color:#6B7A88}
.stage-res{color:#8A98A6}
.device.desktop{
  background:#FFFFFF;
  box-shadow:
    0 28px 70px -36px rgba(16,24,32,.32),
    0 8px 26px -14px rgba(16,24,32,.18),
    0 0 0 1px #D8E1E8;
}
.win-bar{background:#F7F9FB;border-bottom-color:#E3E8EE}
.device.mobile{
  box-shadow:
    0 40px 90px -40px rgba(16,24,32,.45),
    0 0 0 1px rgba(16,24,32,.18),
    inset 0 0 0 1px rgba(255,255,255,.05);
}
.loading{background:#F2F4F7;color:#5F6E7B}
.stage-foot{color:#5F6E7B}
.state{background:#FFFFFF;border-color:#E3E8EE;color:#475666}
.foot-hint{color:#8A98A6}
.dbtn{background:#FFFFFF;border-color:#D8E1E8;color:#33414D}
.dbtn:hover{background:#F7F9FB;color:#101820;border-color:#CBD4DD}
.dbtn.primary{background:#1F3243;color:#FFFFFF;border-color:transparent}
.dbtn.primary:hover{background:#2A4358}
.home-bar{background:rgba(16,24,32,.22)}

</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="mark">红笔</span></div>

<header class="bar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="4.6" y="3.2" width="12.4" height="15.6" rx="2.2" fill="#F7FAFC"/><path d="M7.6 7.6h6.4M7.6 10.4h6.4M7.6 13.2h4" stroke="#1F3243" stroke-width="1.4" stroke-linecap="round"/><path d="M6.2 20.2h9.2" stroke="#C04434" stroke-width="2.2" stroke-linecap="round"/><path d="m16.6 17.2 3.2-3.2" stroke="#C04434" stroke-width="2.2" stroke-linecap="round"/></svg>
    </span>
    <span class="brand-copy">
      <span class="brand-name">红笔</span>
      <span class="brand-sub">RED PEN · 桌面与手机</span>
    </span>
  </div>
  <div class="bar-meta" aria-label="产品说明">
    <span class="meta-item"><i class="dot" aria-hidden="true"></i>36 类规则</span>
    <span class="meta-item">合同文本不出本机</span>
  </div>
  <div class="bar-right">
    <div class="switch" role="tablist" aria-label="选择产品形态">
      <button type="button" role="tab" data-form="desktop" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        桌面客户端
      </button>
      <button type="button" role="tab" data-form="mobile" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
        手机 App
      </button>
    </div>
  </div>
</header>

<main class="stage">
  <div class="stage-head">
    <span class="kicker">SIGNING-DAY REVIEW TOOL</span>
    <span class="stage-title" id="stageTitle">Windows 桌面端</span>
    <span class="stage-note" id="stageNote">顶栏导航 · 双栏审阅工作台</span>
    <span class="stage-res" id="stageRes">1280 × 800</span>
  </div>

  <div class="holder" id="holder">
    <div class="device desktop" id="deviceDesktop">
      <div class="win-bar" aria-hidden="true">
        <span class="win-app">
          <span class="win-mark"><svg viewBox="0 0 24 24"><rect x="4.6" y="3.2" width="12.4" height="15.6" rx="2.2" fill="#F7FAFC"/><path d="M7.6 7.6h6.4M7.6 10.4h6.4M7.6 13.2h4" stroke="#1F3243" stroke-width="1.4" stroke-linecap="round"/><path d="M6.2 20.2h9.2" stroke="#C04434" stroke-width="2.2" stroke-linecap="round"/></svg></span>
          <span class="win-title">红笔 · 签约前 5 分钟</span>
        </span>
        <span class="win-controls"><i>—</i><i>▢</i><i class="close">✕</i></span>
      </div>
      <div class="screen">
        <iframe id="appDesktop" title="红笔 Windows 桌面端" allow="clipboard-read; clipboard-write"></iframe>
        <div class="loading" id="loadDesktop"><span>正在载入…</span></div>
      </div>
    </div>

    <div class="device mobile" id="deviceMobile" hidden>
      <div class="screen">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <span class="status-icons">
            <svg viewBox="0 0 18 12"><path d="M1 11h2V8H1zM5 11h2V6H5zM9 11h2V3H9zM13 11h2V1h-2z"/></svg>
            <svg viewBox="0 0 16 12"><path d="M8 10.6a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6zM3.5 6.1a6.4 6.4 0 0 1 9 0l1.1-1.1a8 8 0 0 0-11.2 0zM1.1 3.7a9.8 9.8 0 0 1 13.8 0L16 2.5a11.4 11.4 0 0 0-16 0z"/></svg>
            <svg viewBox="0 0 24 12"><rect x="1" y="1" width="20" height="10" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="3" width="14" height="6" rx="1"/><path d="M22.4 4.2v3.6a2 2 0 0 0 0-3.6z"/></svg>
          </span>
        </div>
        <iframe id="appMobile" title="红笔 Android 手机端" allow="clipboard-read; clipboard-write"></iframe>
        <div class="punch" aria-hidden="true"></div>
        <div class="home-bar" aria-hidden="true"></div>
      </div>
      <div class="loading" id="loadMobile"><span>正在载入…</span></div>
    </div>
  </div>

  <div class="stage-foot">
    <span class="state"><i id="stateDot" aria-hidden="true"></i><span id="stateText">交稿台</span></span>
    <span class="foot-hint">载入示例合同 → 开始核对 → 查看逐条报告与核对依据</span>
    <div class="demo">
      <button type="button" class="dbtn primary" id="demoBtn">播放完整流程</button>
      <button type="button" class="dbtn" id="demoReset">重置</button>
    </div>

    var bin=atob(b64), n=bin.length, bytes=new Uint8Array(n);
    for(var i=0;i<n;i++) bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  var APP_HTML=decode('appdoc');
  var FORMS={
    desktop:{title:'Windows 桌面端',note:'顶栏导航 · 双栏审阅工作台',res:'1280 × 800'},
    mobile:{title:'Android 手机端',note:'紧凑顶栏 · 报告与原文切换',res:'390 × 844'}
  };
  var LABELS={intake:'交稿台',analyzing:'正在核对',report:'核对报告'};
  var COLORS={intake:'#B5975B',analyzing:'#C04434',report:'#4C8A67'};
  var current='desktop';
  var mobileBooted=false;
  var apps={desktop:document.getElementById('appDesktop'),mobile:document.getElementById('appMobile')};
  var devices={desktop:document.getElementById('deviceDesktop'),mobile:document.getElementById('deviceMobile')};
  var loads={desktop:document.getElementById('loadDesktop'),mobile:document.getElementById('loadMobile')};
  var holder=document.getElementById('holder');
  var stageTitle=document.getElementById('stageTitle');
  var stageNote=document.getElementById('stageNote');
  var stageRes=document.getElementById('stageRes');
  var stateDot=document.getElementById('stateDot');
  var stateText=document.getElementById('stateText');
  var demoBtn=document.getElementById('demoBtn');
  var demoPlaying=false;
  var demoTimer=null;
  function setDemoPlaying(on){
    demoPlaying=on;
    demoBtn.disabled=on;
    demoBtn.textContent=on?'播放中…':'播放完整流程';
    demoBtn.setAttribute('aria-busy',String(on));
    clearTimeout(demoTimer);
    if(on) demoTimer=setTimeout(function(){ setDemoPlaying(false); },30000);
  }
  var ready={desktop:false,mobile:false};
  var pending=null;

  function bootFrame(key){
    if(!APP_HTML) return;
    var vp = key === 'desktop' ? 'width=1280' : 'width=390, initial-scale=1';
    apps[key].srcdoc = APP_HTML.replace('content="width=device-width, initial-scale=1"', 'content="' + vp + '"');
  }
  Object.keys(apps).forEach(function(key){
    apps[key].addEventListener('load',function(){
      ready[key]=true;
      var l=loads[key];
      if(l){ l.classList.add('is-done'); setTimeout(function(){ l.style.display='none'; },320); }
      if(key===current){
        if(pending){ var m=pending; pending=null; setTimeout(function(){ post(m); },0); }
        setTimeout(fit,40);
      }
    });
  });

  function fit(){
    var d=devices[current];
    if(!d||d.hidden) return;
    var w=d.offsetWidth||1, h=d.offsetHeight||1;
    var aw=holder.clientWidth-10, ah=holder.clientHeight-10;
    if(aw<=0||ah<=0) return;
    d.style.transform='scale('+Math.min(1,aw/w,ah/h)+')';
  }

  function setState(phase, label){
    stateText.textContent = label || LABELS[phase] || LABELS.intake;
    stateDot.style.background=COLORS[phase]||COLORS.intake;
    stateDot.classList.toggle('is-live',phase==='analyzing');
  }

  function activate(form){
    current=form;
    document.querySelectorAll('.switch button').forEach(function(b){
      b.setAttribute('aria-selected',String(b.dataset.form===form));
    });
    devices.desktop.hidden=form!=='desktop';
    devices.mobile.hidden=form!=='mobile';
    if(form==='mobile'&&!mobileBooted){ mobileBooted=true; bootFrame('mobile'); }
    stageTitle.textContent=FORMS[form].title;
    stageNote.textContent=FORMS[form].note;
    stageRes.textContent=FORMS[form].res;
    setState('intake');
    fit();
    requestAnimationFrame(function(){ fit(); setTimeout(fit,140); });
  }

  document.querySelectorAll('.switch button').forEach(function(b){
    b.addEventListener('click',function(){ activate(b.dataset.form); });
  });

  function post(msg){
    var frame=apps[current];
    if(!frame) return;
    if(!ready[current]){ pending=msg; return; }
    try{
      var w=frame.contentWindow;
      if(w && w.__redpenProto){
        if(msg.action==='sample') w.__redpenProto.demo(msg.id);
        else if(msg.action==='play') w.__redpenProto.play(msg.id);
        else if(msg.action==='reset') w.__redpenProto.reset();
        return;
      }
    }catch(err){}
    if(!frame.contentWindow) return;
    msg.source='redpen-host';
    frame.contentWindow.postMessage(msg,'*');
  }
  document.getElementById('demoBtn').addEventListener('click',function(){
    setDemoPlaying(true);
    post({action:'play',id:'labor'});
  });
  document.getElementById('demoReset').addEventListener('click',function(){
    setDemoPlaying(false);
    post({action:'reset'});
    setState('intake');
  });

  window.addEventListener('message',function(e){
    var frame=apps[current];
    if(!frame||e.source!==frame.contentWindow) return;
    var d=e.data;
    if(d&&d.source==='redpen-app'&&d.phase){
      setState(d.phase, d.label);
      if(demoPlaying&&d.phase==='report') setTimeout(function(){ setDemoPlaying(false); }, 900);
    }
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='1') activate('desktop');
    else if(e.key==='2') activate('mobile');
  });

  window.addEventListener('resize',fit);
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(holder); }

  bootFrame('desktop');
  activate('desktop');
})();
</script>
</body>
</html>
